next_z_cockpit_expansion:
  status: completed
  ui_heading_reference: Bibliotheken
  ui_heading_rule: "Seitentitel und kurze Erklaerung in Klammern in derselben Zeile"
  completed:
    - id: projektdatei_workflow
      title_de: ProjectOS-Projektdatei im Z_Cockpit erstellen und automatisch laden
      implementation: tools/z_cockpit/project_page.py
      cli: tools/projectos_project_cli.py
      protocol_registration: tools/windows/register_z_project_protocol.ps1
      protocol_handler: tools/windows/open_projectos_from_cockpit.ps1
      documentation: docs/03_Developer/Z_COCKPIT_PROJEKTDATEI.md
      protocol: projectos-z
      active_state: build/Z_COCKPIT_ACTIVE_PROJECT.json
      project_bundle_version: 4
      arbitrary_browser_path_input: false
    - id: projektdatei_zugriffsschutz
      title_de: ProjectOS-Projektdateien nach Schutzklasse und Dateirechten absichern
      implementation: tools/z_cockpit/project_access.py
      documentation: docs/03_Developer/Z_COCKPIT_PROJEKTDATEI.md
      default_protection: private_team
      confidential_in_general_source_repository: blocked
      private_team_storage: separate_private_project_repository
      project_file_permissions: [project.file.read, project.file.write, project.file.share, project.file.admin]
      local_identity_is_authentication: false
    - id: benutzerverwaltung
      title_de: Benutzerverwaltung im Z_Cockpit integrieren
      implementation: tools/z_cockpit/user_management_page.py
      documentation: docs/03_Developer/Z_COCKPIT_BENUTZERVERWALTUNG.md
      project_bundle_option: "python -m tools.generate_z_cockpit --project-bundle <projektdatei>"
    - id: benutzer_simulation
      title_de: Testuser, aktive Identitaet und Simulationsmodus integrieren
      implementation: tools/z_cockpit/user_simulation.py
      documentation: docs/03_Developer/Z_COCKPIT_BENUTZERVERWALTUNG.md
      local_storage_key: z-cockpit.identity.v1
      test_user_id: 00000000-0000-0000-0000-000000000001
      test_user_persisted: false
      authentication_backend: false
      projectos_write_access: false
      kicad_editor_calls_blocked_in_simulation: true
    - id: whitelist_verwaltung
      title_de: Whitelist- und Berechtigungsverwaltung integrieren
      implementation: tools/z_cockpit/permissions_page.py
      documentation: docs/03_Developer/Z_COCKPIT_BERECHTIGUNGEN.md
      projectos_source: ProjectOSUserManagementState.permission_assignments
      repository_developer_whitelist: config/authorized_developers.json
      static_html_write_access: false
    - id: issue_fehlermeldung
      title_de: Issue- und Fehlermeldungsworkflow integrieren
      implementation: tools/z_cockpit/issue_report_page.py
      documentation: docs/03_Developer/Z_COCKPIT_FEHLERMELDUNG.md
      issue_form: .github/ISSUE_TEMPLATE/bug_report.yml
      repository_check: "python -m tools.check_repository_version"
      repository_result: build/VERSIONSPRUEFUNG.json
      automatic_issue_submission: false
    - id: 3d_vorschauen
      title_de: 3D-Vorschauen und Modellabdeckung anbinden
      implementation: tools/z_cockpit/three_d_preview.py
      generator: tools/generate_3d_previews.py
      documentation: docs/03_Developer/Z_COCKPIT_3D_VORSCHAUEN.md
      model_root: 3dmodels/Z_3DModell.3dshapes
      generated_previews: docs/site/3d-previews
      fake_product_geometry: false
      hull_preview_counts_as_model: false
    - id: kicad_editoraufrufe
      title_de: Direkte KiCad-Editoraufrufe anbinden
      implementation: tools/z_cockpit/editor_links.py
      protocol_registration: tools/windows/register_z_kicad_protocol.ps1
      protocol_handler: tools/windows/open_kicad_from_cockpit.ps1
      documentation: docs/03_Developer/Z_COCKPIT_KICAD_EDITORAUFRUFE.md
      protocol: kicad-z
      arbitrary_path_input: false
      arbitrary_command_input: false
    - id: runtime_diagnostics_persistence
      title_de: Persistenzanbindung der Laufzeitdiagnosen
      persistence: distributions/projectos_project_memory_persistence.py
      cockpit_bridge: tools/z_cockpit/runtime_diagnostics.py
      default_path: build/PROJECTOS_RUNTIME_MEMORY.json
      documentation: docs/03_Developer/Z_COCKPIT_LAUFZEITDIAGNOSEN.md
      project_memory_persistence_version: 1
      derived_diagnostics_persisted: false
  order: []
  specification: docs/projectos/Z_COCKPIT_AUSBAU_BENUTZER_WHITELIST_ISSUES.md
  handover: docs/handover/ARBEITSSTAND_2026-08-10_Z_COCKPIT_PROJEKTDATEI.md
  project_file_workflow:
    domain_creator: distributions.din_editor_project_manager.DinEditorProjectManager
    bundle_version: 4
    browser_protocol: projectos-z
    browser_passes_project_name_only: true
    browser_passes_protection_class: true
    browser_passes_file_path: false
    path_selection: native_windows_save_dialog
    protocol_registry_scope: current_user
    active_state: build/Z_COCKPIT_ACTIVE_PROJECT.json
    active_state_schema: 2
    active_state_versioned: false
    legacy_active_state_schema_1_supported: true
    active_project_revalidated_on_start: true
    invalid_active_project_is_nonblocking: true
    blocked_in_simulation: true
    protection_modes: [private_team, restricted_local, repository_visible]
    default_protection: private_team
    confidential_general_source_repository_target: blocked
    repository_visible_requires_confirmation: true
    private_team_requires_separate_private_repository: true
    github_single_repository_per_file_visibility: false
    projectos_file_permissions: [project.file.read, project.file.write, project.file.share, project.file.admin]
    projectos_rights_replace_storage_acl: false
    local_identity_is_security_authentication: false
  whitelist_separation:
    projectos_user_permissions: distributions/projectos_user_management_persistence.py
    repository_developer_whitelist: config/authorized_developers.json
  permission_write_path:
    service: distributions/projectos_user_management_change_service.py
    authorization: distributions/projectos_user_management_command_authorization.py
  user_simulation_policy:
    local_identity_is_authentication: false
    local_identity_storage: z-cockpit.identity.v1
    test_user_is_projectos_entity: false
    test_user_default_weight: 100
    test_user_permissions_persisted: false
    existing_user_permissions_use_projectos_evaluator: true
    simulation_mutates_projectos: false
    simulation_blocks_kicad_z_editor_calls: true
  issue_report_privacy:
    excludes_user_management_dump: true
    excludes_authenticated_github_user: true
    excludes_tokens_keys_credentials: true
    explicit_preview_confirmation: true
  three_d_preview_policy:
    real_model_requires_kicad_model_reference_and_repository_file: true
    technical_hull_source: F.Fab
    technical_hull_is_not_real_model: true
    external_model_download: false
  kicad_editor_link_policy:
    browser_executes_processes: false
    protocol_registry_scope: current_user
    repository_identifiers_only: true
    footprint_direct_file_open: true
    symbol_reference_copied_to_clipboard: true
    symbol_editor_manager_hotkey: Ctrl+L
  runtime_diagnostics_policy:
    source_data_only: true
    project_memory_persistence_version: 1
    default_local_artifact: build/PROJECTOS_RUNTIME_MEMORY.json
    ignored_local_artifact: true
    missing_source_is_nonblocking: true
    diagnostics_recomputed_on_cockpit_generation: true
    project_bundle_v4_unchanged: true
  ruleset_status: blocked_separate_approval

remaining_technical_followups:
  - github_ruleset_activation_blocked

adrs: [ADR-0001, ADR-0002, ADR-0003, ADR-0004, ADR-0005, ADR-0006, ADR-0007, ADR-0008]
initial_validation_domains: [MCB, RCCB]

