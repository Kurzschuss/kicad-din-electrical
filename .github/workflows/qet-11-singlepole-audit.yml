name: QET 11_singlepole validation

on:
  push:
    branches:
      - agent/qet-phase1-11-singlepole
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/convert_qet_to_kicad_checked.py"
      - "tools/audit_qet_source.py"
      - "tools/apply_qet_de_names.py"
      - "tests/test_convert_qet_to_kicad.py"
      - "tests/test_convert_qet_to_kicad_checked.py"
      - "tests/test_audit_qet_source.py"
      - "tests/test_apply_qet_de_names.py"
      - "tests/test_qet_11_singlepole_names.py"
      - "config/qet_de_names/11_singlepole/**"
      - ".github/workflows/qet-11-singlepole-audit.yml"
  workflow_dispatch:
    inputs:
      qet_ref:
        description: "qelectrotech-elements ref/commit"
        required: true
        default: "42692ea76d2fcc3c6cf1ca335951584cd0978922"

permissions:
  contents: read

jobs:
  validate-qet-11-singlepole:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official QElectroTech elements
        uses: actions/checkout@v4
        with:
          repository: qelectrotech/qelectrotech-elements
          ref: ${{ github.event.inputs.qet_ref || '42692ea76d2fcc3c6cf1ca335951584cd0978922' }}
          path: .qet-elements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run converter, audit and name tests
        run: |
          python -m pytest \
            tests/test_convert_qet_to_kicad.py \
            tests/test_convert_qet_to_kicad_checked.py \
            tests/test_audit_qet_source.py \
            tests/test_apply_qet_de_names.py \
            tests/test_qet_11_singlepole_names.py \
            -q

      - name: Convert complete 11_singlepole raw scope
        run: |
          python tools/convert_qet_to_kicad_checked.py \
            --qet-root .qet-elements/10_electric \
            --scope 11_singlepole \
            --output build/Z_Q_QElectroTech_11_singlepole.kicad_sym \
            --report build/qet-11-singlepole-report.json \
            --fail-on-errors
          git -C .qet-elements rev-parse HEAD > build/qet-source-commit.txt

      - name: Audit missing German source names
        run: |
          python tools/audit_qet_source.py \
            --qet-root .qet-elements/10_electric \
            --scope 11_singlepole \
            --output build/qet-11-singlepole-source-audit.json

      - name: Apply reviewed German visible names
        run: |
          python tools/apply_qet_de_names.py \
            --library build/Z_Q_QElectroTech_11_singlepole.kicad_sym \
            --config-dir config/qet_de_names/11_singlepole \
            --report build/qet-11-singlepole-de-name-report.json \
            --strict

      - name: Validate final library and exact name coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          library = Path("build/Z_Q_QElectroTech_11_singlepole.kicad_sym").read_text(encoding="utf-8")
          report = json.loads(Path("build/qet-11-singlepole-report.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("build/qet-11-singlepole-source-audit.json").read_text(encoding="utf-8"))
          names = json.loads(Path("build/qet-11-singlepole-de-name-report.json").read_text(encoding="utf-8"))

          assert report["source_files"] > 0
          assert report["converted"] == report["source_files"]
          assert not report["errors"]
          assert not report["unsupported_nodes"]
          assert audit["source_files"] == report["source_files"]
          assert audit["missing_german_names"] == report["missing_german_names"]
          assert not audit["parse_errors"]

          audited_paths = {item["path"] for item in audit["items"]}
          applied_paths = set(names["applied_paths"])
          assert names["configured_overrides"] == audit["missing_german_names"] == 144
          assert names["applied_overrides"] == 144
          assert not names["unmatched_override_paths"]
          assert applied_paths == audited_paths
          assert library.count("german_name_override") == 144

          top_level = sum(
              1 for line in library.splitlines()
              if line.startswith('  (symbol "Z_Q_')
          )
          assert top_level == report["converted"]
          assert library.count('(property "QET_Source_Path" ') == report["converted"]
          assert library.count('(property "QET_Category" ') == report["converted"]
          assert library.count('(property "QET_Adjustments" ') == report["converted"]
          PY

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version --format about | tee build/kicad-version.txt

      - name: Load and render all final 11_singlepole symbols with KiCad
        run: |
          mkdir -p build/kicad-svg-11-singlepole
          kicad-cli sym export svg \
            --black-and-white \
            --output build/kicad-svg-11-singlepole \
            build/Z_Q_QElectroTech_11_singlepole.kicad_sym
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/qet-11-singlepole-report.json").read_text(encoding="utf-8"))
          svg_files = sorted(Path("build/kicad-svg-11-singlepole").glob("*.svg"))
          assert len(svg_files) == report["converted"], (len(svg_files), report["converted"])
          assert all(path.stat().st_size > 0 for path in svg_files)
          Path("build/qet-11-singlepole-kicad-smoke-report.json").write_text(
              json.dumps(
                  {
                      "exported_svg_symbols": len(svg_files),
                      "expected_symbols": report["converted"],
                      "empty_svg_files": 0,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Print validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/qet-11-singlepole-report.json").read_text(encoding="utf-8"))
          names = json.loads(Path("build/qet-11-singlepole-de-name-report.json").read_text(encoding="utf-8"))
          smoke = json.loads(Path("build/qet-11-singlepole-kicad-smoke-report.json").read_text(encoding="utf-8"))
          print(json.dumps({"conversion": report, "names": names, "kicad": smoke}, ensure_ascii=False, indent=2))
          PY

      - name: Upload 11_singlepole validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qet-11-singlepole-validation
          path: |
            build/Z_Q_QElectroTech_11_singlepole.kicad_sym
            build/qet-11-singlepole-report.json
            build/qet-11-singlepole-source-audit.json
            build/qet-11-singlepole-de-name-report.json
            build/qet-11-singlepole-kicad-smoke-report.json
            build/qet-source-commit.txt
            build/kicad-version.txt
