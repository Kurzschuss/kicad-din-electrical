name: QET master validation on main

on:
  push:
    branches:
      - main
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/convert_qet_to_kicad_checked.py"
      - "tools/qet_xml.py"
      - "tools/audit_qet_source.py"
      - "tools/apply_qet_de_names.py"
      - "tools/apply_qet_language_neutral_names.py"
      - "tools/generate_qet_98_assembly_de_names.py"
      - "tools/generate_qet_energy_de_names.py"
      - "tools/merge_qet_kicad_libraries.py"
      - "config/qet_de_names/**"
      - "tests/test_merge_qet_kicad_libraries.py"
      - ".github/workflows/qet-master-integration.yml"
      - ".github/workflows/qet-master-main-dispatch.yml"

concurrency:
  group: qet-master-main-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  dispatch-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch complete QET master validation on main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          QET_REF: 42692ea76d2fcc3c6cf1ca335951584cd0978922
        run: |
          set -euo pipefail

          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run qet-master-integration.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f qet_ref="$QET_REF"

          master_run_id=""
          for attempt in $(seq 1 30); do
            master_run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qet-master-integration.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
                | jq -r \
                    --arg sha "$GITHUB_SHA" \
                    --arg since "$dispatched_at" \
                    '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $since)] | sort_by(.created_at) | first | .id // empty'
            )"
            if [[ -n "$master_run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$master_run_id" ]]; then
            echo "Could not resolve the dispatched QET master workflow run." >&2
            exit 1
          fi

          echo "master_run_id=${master_run_id}" >> "$GITHUB_OUTPUT"
          echo "Dispatched QET master workflow run ${master_run_id}."

      - name: Wait for complete QET master validation
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_RUN_ID: ${{ steps.dispatch.outputs.master_run_id }}
        run: |
          set -euo pipefail
          gh run watch "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

      - name: Download validated QET master artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_RUN_ID: ${{ steps.dispatch.outputs.master_run_id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name qet-master-library-validation \
            --dir release

      - name: Prepare release metadata and checksums
        id: meta
        env:
          MASTER_RUN_ID: ${{ steps.dispatch.outputs.master_run_id }}
          QET_REF: 42692ea76d2fcc3c6cf1ca335951584cd0978922
        run: |
          set -euo pipefail

          required=(
            Z_Q_QElectroTech.kicad_sym
            qet-master-manifest.json
            qet-master-merge-report.json
            qet-master-kicad-smoke-report.json
            kicad-version.txt
            qet-source-commit.txt
          )
          for name in "${required[@]}"; do
            test -s "release/${name}"
          done

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          qet_source="$(tr -d '\r\n' < release/qet-source-commit.txt)"
          [[ "$qet_source" == "$QET_REF" ]]

          short_sha="${GITHUB_SHA:0:12}"
          tag="qet-master-${short_sha}"

          {
            echo "tag=${tag}"
            echo "short_sha=${short_sha}"
            echo "qet_source=${qet_source}"
          } >> "$GITHUB_OUTPUT"

          (
            cd release
            sha256sum \
              Z_Q_QElectroTech.kicad_sym \
              qet-master-manifest.json \
              qet-master-merge-report.json \
              qet-master-kicad-smoke-report.json \
              kicad-version.txt \
              qet-source-commit.txt \
              > SHA256SUMS.txt
          )

          cat > release/RELEASE_NOTES.md <<EOF
          Validierter QElectroTech-Masterbuild aus Repository-Commit \`${GITHUB_SHA}\`.

          - QElectroTech-Upstream: \`${qet_source}\`
          - Master-Workflow-Run: \`${MASTER_RUN_ID}\`
          - KiCad-Symbole: 8.755
          - KiCad-Renderprüfung: 8.755 / 8.755, 0 leere SVG-Dateien

          Die Datei \`Z_Q_QElectroTech.kicad_sym\` ist die direkt in KiCad einzubindende Masterbibliothek. \`SHA256SUMS.txt\` enthält die Prüfsummen aller veröffentlichten Validierungsdateien.
          EOF

      - name: Publish durable QET master snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the immutable snapshot unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            release/Z_Q_QElectroTech.kicad_sym \
            release/qet-master-manifest.json \
            release/qet-master-merge-report.json \
            release/qet-master-kicad-smoke-report.json \
            release/kicad-version.txt \
            release/qet-source-commit.txt \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QElectroTech Master Library ${SHORT_SHA}" \
            --notes-file release/RELEASE_NOTES.md \
            --latest=false
