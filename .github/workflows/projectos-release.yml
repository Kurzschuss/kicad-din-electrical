name: ProjectOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "projectos-v*.*.*"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build-Werkzeuge und Testabhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install build

      - name: ProjectOS-Syntax prüfen
        run: python -m compileall -q projectos tests

      - name: Tests ausführen
        run: python -m pytest -q

      - name: Distributionen bauen
        run: python -m build

      - name: Prüfsummen erzeugen
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Build-Artefakte speichern
        uses: actions/upload-artifact@v4
        with:
          name: projectos-${{ github.ref_name }}
          path: |
            dist/*
          if-no-files-found: error
