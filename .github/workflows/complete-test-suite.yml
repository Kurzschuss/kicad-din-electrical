name: ProjectOS complete test suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/projectos-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run repository health check
        run: python -m pytest -q tests/test_projectos_repository_consistency.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run Z_ quality release profile
        run: |
          python -m tools.quality.run_quality \
            --profile release \
            --json-output build/Z_QUALITY_RESULTS.json \
            --html-output build/Z_QUALITY_REPORT.html \
            --footprint footprints/Z_DIN_Module_18mm.pretty/Z_DIN_Module_18mm.kicad_mod \
            symbols/Z_MCB.kicad_sym

      - name: Validate KiCad libraries
        run: python tools/validate_libraries.py

      - name: Check generated device variants
        run: python tools/generate_device_variants.py --check

      - name: Validate device catalog
        run: python tools/validate_device_catalog.py

      - name: Check generated library reference
        run: |
          python tools/generate_library_reference.py
          git diff --exit-code -- docs/04_Reference/SYMBOL_INDEX.md docs/04_Reference/FOOTPRINT_INDEX.md

      - name: Check generated quality report
        run: python tools/generate_quality_report.py --check

      - name: Check generated symbol previews
        run: python tools/generate_symbol_previews.py --check

      - name: Check generated HTML reference
        run: |
          python -m tools.generate_html_reference
          git diff --exit-code -- docs/site/index.html

      - name: Check generated device catalog HTML
        run: python -m tools.generate_device_catalog_html --check

      - name: Generate Z_Cockpit HTML
        run: |
          python -m tools.generate_z_cockpit
          test -s docs/site/z-cockpit.html
