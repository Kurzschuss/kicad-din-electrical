name: ProjectOS complete test suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/projectos-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: agent/main-switch-package

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate main-switch package artifacts
        run: |
          python tools/generate_device_variants.py
          python tools/generate_package_progress.py
          python tools/generate_library_reference.py
          python tools/generate_quality_report.py
          python tools/generate_symbol_previews.py
          python -m tools.generate_html_reference
          python -m tools.generate_device_catalog_html
          python -m tools.generate_z_cockpit

      - name: Commit generated main-switch artifacts and restore workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/complete-test-suite.yml
          git add \
            data/devices/generated/generic.main-switch-2p-template-series/ \
            data/devices/generated/generic.main-switch-4p-template-series/ \
            docs/04_Reference/Z_PACKAGE_PROGRESS.md \
            docs/04_Reference/QUALITY_REPORT.md \
            docs/04_Reference/SYMBOL_INDEX.md \
            docs/04_Reference/FOOTPRINT_INDEX.md \
            docs/site/symbol-previews/Z_MAIN_SWITCH/ \
            docs/site/symbol-previews/index.html \
            docs/site/index.html \
            docs/site/devices.html \
            .github/workflows/complete-test-suite.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Hauptschalter: generierte Paketartefakte aktualisieren"
            git push origin HEAD:agent/main-switch-package
          fi

      - name: Run repository health check
        run: python -m pytest -q tests/test_projectos_repository_consistency.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run Python syntax check
        run: python -W error::SyntaxWarning -m compileall -q distributions tests tools

      - name: Run Z_ quality release profile
        run: |
          python -m tools.quality.run_quality \
            --profile release \
            --json-output build/Z_QUALITY_RESULTS.json \
            --html-output build/Z_QUALITY_REPORT.html \
            --footprint footprints/Z_DIN_Module_18mm.pretty/Z_DIN_Module_18mm.kicad_mod \
            symbols/Z_MCB.kicad_sym

      - name: Validate KiCad libraries
        run: python tools/validate_libraries.py

      - name: Check generated device variants
        run: python tools/generate_device_variants.py --check

      - name: Validate device catalog
        run: python tools/validate_device_catalog.py

      - name: Check generated library reference
        run: |
          python tools/generate_library_reference.py
          git diff --exit-code -- docs/04_Reference/SYMBOL_INDEX.md docs/04_Reference/FOOTPRINT_INDEX.md

      - name: Check generated quality report
        run: python tools/generate_quality_report.py --check

      - name: Check generated symbol previews
        run: python tools/generate_symbol_previews.py --check

      - name: Check generated 3D previews
        run: python tools/generate_3d_previews.py --check

      - name: Check generated HTML reference
        run: |
          python -m tools.generate_html_reference
          git diff --exit-code -- docs/site/index.html

      - name: Check generated device catalog HTML
        run: python -m tools.generate_device_catalog_html --check

      - name: Run ProjectOS project validator
        run: python -m tools.project_validator --json-output build/Z_PROJECT_VALIDATION.json

      - name: Generate Z_Cockpit HTML
        run: |
          python -m tools.generate_z_cockpit
          test -s docs/site/z-cockpit.html
