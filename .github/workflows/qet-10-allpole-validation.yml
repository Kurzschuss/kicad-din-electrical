name: QET 10_allpole validation

on:
  workflow_dispatch:
    inputs:
      qet_ref:
        description: "qelectrotech-elements ref/commit"
        required: true
        default: "42692ea76d2fcc3c6cf1ca335951584cd0978922"
  pull_request:
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/audit_qet_source.py"
      - "tests/test_convert_qet_to_kicad.py"
      - "tests/test_audit_qet_source.py"
      - ".github/workflows/qet-10-allpole-validation.yml"

permissions:
  contents: read

jobs:
  validate-qet-10-allpole:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official QElectroTech elements
        uses: actions/checkout@v4
        with:
          repository: qelectrotech/qelectrotech-elements
          ref: ${{ github.event.inputs.qet_ref || '42692ea76d2fcc3c6cf1ca335951584cd0978922' }}
          path: .qet-elements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run QET unit tests
        run: |
          python -m pytest \
            tests/test_convert_qet_to_kicad.py \
            tests/test_audit_qet_source.py \
            -q

      - name: Convert complete 10_allpole
        run: |
          python tools/convert_qet_to_kicad.py \
            --qet-root .qet-elements/10_electric \
            --scope 10_allpole \
            --output build/Z_Q_QElectroTech.kicad_sym \
            --report build/qet-10-allpole-report.json \
            --fail-on-errors
          git -C .qet-elements rev-parse HEAD > build/qet-source-commit.txt

      - name: Audit missing German source names
        run: |
          python tools/audit_qet_source.py \
            --qet-root .qet-elements/10_electric \
            --scope 10_allpole \
            --output build/qet-source-audit.json

      - name: Validate generated KiCad library structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          library = Path("build/Z_Q_QElectroTech.kicad_sym").read_text(encoding="utf-8")
          report = json.loads(Path("build/qet-10-allpole-report.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("build/qet-source-audit.json").read_text(encoding="utf-8"))

          assert library.startswith("(kicad_symbol_lib ")
          assert library.rstrip().endswith(")")

          depth = 0
          in_string = False
          escaped = False
          for ch in library:
              if in_string:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  continue
              if ch == '"':
                  in_string = True
              elif ch == "(":
                  depth += 1
              elif ch == ")":
                  depth -= 1
                  assert depth >= 0
          assert depth == 0
          assert not in_string

          top_level_symbols = sum(
              1 for line in library.splitlines()
              if line.startswith('  (symbol "Z_Q_')
          )
          assert top_level_symbols == report["converted"], (top_level_symbols, report["converted"])
          assert library.count('(property "QET_Source_Path" ') == report["converted"]
          assert library.count('(property "QET_Category" ') == report["converted"]
          assert library.count('(property "QET_Adjustments" ') == report["converted"]
          assert library.count('(property "QET_Original_Pin_Count" "0"') == report["zero_pin_symbols"]
          assert audit["source_files"] == report["source_files"]
          assert audit["missing_german_names"] == report["missing_german_names"]
          assert not audit["parse_errors"]
          PY

      - name: Assert full source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/qet-10-allpole-report.json").read_text(encoding="utf-8"))
          assert report["source_files"] > 0, report
          assert report["converted"] == report["source_files"], report
          assert not report["errors"], report
          assert not report["unsupported_nodes"], report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload conversion result and audit
        uses: actions/upload-artifact@v4
        with:
          name: qet-10-allpole-validation
          path: |
            build/Z_Q_QElectroTech.kicad_sym
            build/qet-10-allpole-report.json
            build/qet-source-audit.json
            build/qet-source-commit.txt
