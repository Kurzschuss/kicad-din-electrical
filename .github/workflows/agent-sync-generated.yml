name: Agent sync generated artifacts

on:
  push:
    branches:
      - agent/rcd-4p-family-72-variants
    paths:
      - .agent-sync-generated

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/rcd-4p-family-72-variants

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regenerate tracked artifacts
        run: |
          python tools/generate_device_variants.py
          python tools/generate_library_reference.py
          python tools/generate_quality_report.py
          python tools/generate_symbol_previews.py
          python -m tools.generate_html_reference
          python -m tools.generate_device_catalog_html
          python -m tools.generate_z_cockpit

      - name: Commit generated artifacts
        run: |
          git config user.name "projectos-generator"
          git config user.email "projectos-generator@users.noreply.github.com"
          git add data/devices/generated docs/04_Reference/SYMBOL_INDEX.md docs/04_Reference/FOOTPRINT_INDEX.md docs/04_Reference/QUALITY_REPORT.md docs/site
          if git diff --cached --quiet; then
            echo "Keine Generatoränderungen."
            exit 0
          fi
          git commit -m "RCD 4P: generierte Artefakte synchronisieren"
          git push origin HEAD:agent/rcd-4p-family-72-variants
