name: QET 99 miscellaneous unsorted validation

on:
  push:
    branches:
      - agent/qet-phase1-99-miscellaneous-unsorted
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/convert_qet_to_kicad_checked.py"
      - "tools/qet_xml.py"
      - "tools/audit_qet_source.py"
      - "tools/apply_qet_language_neutral_names.py"
      - "tests/test_convert_qet_to_kicad.py"
      - "tests/test_convert_qet_to_kicad_checked.py"
      - "tests/test_audit_qet_source.py"
      - "tests/test_qet_legacy_manufacturer.py"
      - ".github/workflows/qet-99-miscellaneous-unsorted-audit.yml"
  workflow_dispatch:
    inputs:
      qet_ref:
        description: "qelectrotech-elements ref/commit"
        required: true
        default: "42692ea76d2fcc3c6cf1ca335951584cd0978922"

permissions:
  contents: read

jobs:
  validate-qet-miscellaneous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official QElectroTech elements
        uses: actions/checkout@v4
        with:
          repository: qelectrotech/qelectrotech-elements
          ref: ${{ github.event.inputs.qet_ref || '42692ea76d2fcc3c6cf1ca335951584cd0978922' }}
          path: .qet-elements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run converter and sanitation tests
        run: |
          python -m pytest \
            tests/test_convert_qet_to_kicad.py \
            tests/test_convert_qet_to_kicad_checked.py \
            tests/test_audit_qet_source.py \
            tests/test_qet_legacy_manufacturer.py \
            -q

      - name: Convert complete miscellaneous scope
        run: |
          python tools/convert_qet_to_kicad_checked.py \
            --qet-root .qet-elements/10_electric \
            --scope 99_miscellaneous_unsorted \
            --output build/Z_Q_QElectroTech_99_miscellaneous_unsorted.kicad_sym \
            --report build/qet-99-miscellaneous-unsorted-report.json \
            --fail-on-errors
          git -C .qet-elements rev-parse HEAD > build/qet-source-commit.txt

      - name: Audit source names
        run: |
          python tools/audit_qet_source.py \
            --qet-root .qet-elements/10_electric \
            --scope 99_miscellaneous_unsorted \
            --output build/qet-99-miscellaneous-unsorted-source-audit.json

      - name: Accept reviewed language-neutral names
        run: |
          python tools/apply_qet_language_neutral_names.py \
            --library build/Z_Q_QElectroTech_99_miscellaneous_unsorted.kicad_sym \
            --audit build/qet-99-miscellaneous-unsorted-source-audit.json \
            --report build/qet-99-miscellaneous-unsorted-language-neutral-report.json

      - name: Validate miscellaneous library and German name coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          library = Path("build/Z_Q_QElectroTech_99_miscellaneous_unsorted.kicad_sym").read_text(encoding="utf-8")
          report = json.loads(Path("build/qet-99-miscellaneous-unsorted-report.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("build/qet-99-miscellaneous-unsorted-source-audit.json").read_text(encoding="utf-8"))
          neutral = json.loads(Path("build/qet-99-miscellaneous-unsorted-language-neutral-report.json").read_text(encoding="utf-8"))

          assert report["source_files"] == report["converted"] == 11
          assert report["zero_pin_symbols"] == 0
          assert not report["errors"], report["errors"]
          assert not report["unsupported_nodes"], report["unsupported_nodes"]
          assert audit["source_files"] == 11
          assert audit["missing_german_names"] == report["missing_german_names"] == 1
          assert audit["items"][0]["path"] == "10_electric/99_miscellaneous_unsorted/ecl.elmt"
          assert audit["items"][0]["names"]["en"] == "ECL"
          assert not audit["parse_errors"], audit["parse_errors"]
          assert not audit["sanitized_xml_files"], audit["sanitized_xml_files"]

          assert neutral["audited_missing_german_names"] == 1
          assert neutral["language_neutral_candidates"] == 1
          assert neutral["language_neutral_applied"] == 1
          assert neutral["applied_paths"] == ["10_electric/99_miscellaneous_unsorted/ecl.elmt"]
          assert neutral["remaining_translation_count"] == 0
          assert neutral["remaining_translation_paths"] == []
          assert library.count("language_neutral_name_accepted") == 1
          assert "german_name_fallback:en" not in library

          top_level = sum(1 for line in library.splitlines() if line.startswith('  (symbol "Z_Q_'))
          assert top_level == report["converted"]
          assert library.count('(property "QET_Source_Path" ') == report["converted"]
          assert library.count('(property "QET_Category" ') == report["converted"]
          assert library.count('(property "QET_Adjustments" ') == report["converted"]
          PY

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version --format about | tee build/kicad-version.txt

      - name: Load and render all miscellaneous symbols with KiCad
        run: |
          mkdir -p build/kicad-svg-99-miscellaneous-unsorted
          kicad-cli sym export svg --black-and-white \
            --output build/kicad-svg-99-miscellaneous-unsorted \
            build/Z_Q_QElectroTech_99_miscellaneous_unsorted.kicad_sym
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/qet-99-miscellaneous-unsorted-report.json").read_text(encoding="utf-8"))
          svg_files = sorted(Path("build/kicad-svg-99-miscellaneous-unsorted").glob("*.svg"))
          assert len(svg_files) == report["converted"] == 11
          assert all(path.stat().st_size > 0 for path in svg_files)
          Path("build/qet-99-miscellaneous-unsorted-kicad-smoke-report.json").write_text(
              json.dumps({"exported_svg_symbols": len(svg_files), "expected_symbols": report["converted"], "empty_svg_files": 0}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload miscellaneous validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qet-99-miscellaneous-unsorted-validation
          path: |
            build/Z_Q_QElectroTech_99_miscellaneous_unsorted.kicad_sym
            build/qet-99-miscellaneous-unsorted-report.json
            build/qet-99-miscellaneous-unsorted-source-audit.json
            build/qet-99-miscellaneous-unsorted-language-neutral-report.json
            build/qet-99-miscellaneous-unsorted-kicad-smoke-report.json
            build/qet-source-commit.txt
            build/kicad-version.txt
