name: QET manufacturers validation

on:
  push:
    branches:
      - agent/qet-phase1-manufacturers
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/convert_qet_to_kicad_checked.py"
      - "tools/qet_xml.py"
      - "tools/audit_qet_source.py"
      - "tools/apply_qet_language_neutral_names.py"
      - "tools/apply_qet_de_names.py"
      - "tests/test_convert_qet_to_kicad.py"
      - "tests/test_convert_qet_to_kicad_checked.py"
      - "tests/test_audit_qet_source.py"
      - "tests/test_qet_legacy_manufacturer.py"
      - "tests/test_qet_manufacturer_fill.py"
      - "tests/test_apply_qet_language_neutral_names.py"
      - "tests/test_qet_manufacturer_names.py"
      - "config/qet_de_names/manufacturers/**"
      - ".github/workflows/qet-manufacturers-audit.yml"
  workflow_dispatch:
    inputs:
      qet_ref:
        description: "qelectrotech-elements ref/commit"
        required: true
        default: "42692ea76d2fcc3c6cf1ca335951584cd0978922"

permissions:
  contents: read

jobs:
  validate-qet-manufacturers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official QElectroTech elements
        uses: actions/checkout@v4
        with:
          repository: qelectrotech/qelectrotech-elements
          ref: ${{ github.event.inputs.qet_ref || '42692ea76d2fcc3c6cf1ca335951584cd0978922' }}
          path: .qet-elements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run manufacturer conversion tests
        run: |
          python -m pytest \
            tests/test_convert_qet_to_kicad.py \
            tests/test_convert_qet_to_kicad_checked.py \
            tests/test_audit_qet_source.py \
            tests/test_qet_legacy_manufacturer.py \
            tests/test_qet_manufacturer_fill.py \
            tests/test_apply_qet_language_neutral_names.py \
            tests/test_qet_manufacturer_names.py \
            -q

      - name: Convert complete manufacturer scope
        run: |
          python tools/convert_qet_to_kicad_checked.py \
            --qet-root .qet-elements/10_electric \
            --scope 20_manufacturers_articles \
            --output build/Z_Q_QElectroTech_manufacturers.kicad_sym \
            --report build/qet-manufacturers-report.json \
            --fail-on-errors
          git -C .qet-elements rev-parse HEAD > build/qet-source-commit.txt

      - name: Audit source names
        run: |
          python tools/audit_qet_source.py \
            --qet-root .qet-elements/10_electric \
            --scope 20_manufacturers_articles \
            --output build/qet-manufacturers-source-audit.json

      - name: Accept conservative language-neutral identifiers
        run: |
          python tools/apply_qet_language_neutral_names.py \
            --library build/Z_Q_QElectroTech_manufacturers.kicad_sym \
            --audit build/qet-manufacturers-source-audit.json \
            --report build/qet-manufacturers-language-neutral-report.json

      - name: Apply reviewed German manufacturer names
        run: |
          python tools/apply_qet_de_names.py \
            --library build/Z_Q_QElectroTech_manufacturers.kicad_sym \
            --config-dir config/qet_de_names/manufacturers \
            --report build/qet-manufacturers-de-name-report.json \
            --strict

      - name: Validate manufacturer coverage and write progress report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          library = Path("build/Z_Q_QElectroTech_manufacturers.kicad_sym").read_text(encoding="utf-8")
          conversion = json.loads(Path("build/qet-manufacturers-report.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("build/qet-manufacturers-source-audit.json").read_text(encoding="utf-8"))
          neutral = json.loads(Path("build/qet-manufacturers-language-neutral-report.json").read_text(encoding="utf-8"))
          german = json.loads(Path("build/qet-manufacturers-de-name-report.json").read_text(encoding="utf-8"))

          assert conversion["source_files"] == conversion["converted"] == 4019
          assert not conversion["errors"]
          assert not conversion["unsupported_nodes"]
          assert audit["source_files"] == 4019
          assert audit["missing_german_names"] == conversion["missing_german_names"] == 1605
          assert not audit["parse_errors"]
          assert len(audit["sanitized_xml_files"]) == 1
          assert neutral["language_neutral_candidates"] == neutral["language_neutral_applied"] == 672
          assert german["configured_overrides"] == german["applied_overrides"]
          assert not german["unmatched_override_paths"]

          neutral_paths = set(neutral["applied_paths"])
          german_paths = set(german["applied_paths"])
          missing_paths = {item["path"] for item in audit["items"]}
          assert neutral_paths.isdisjoint(german_paths)
          assert neutral_paths | german_paths <= missing_paths

          resolved = len(neutral_paths | german_paths)
          remaining = len(missing_paths - neutral_paths - german_paths)
          assert resolved + remaining == 1605
          assert library.count("language_neutral_name_accepted") == len(neutral_paths)
          assert library.count("german_name_override") == len(german_paths)

          top_level = sum(1 for line in library.splitlines() if line.startswith('  (symbol "Z_Q_'))
          assert top_level == 4019

          progress = {
              "source_files": 4019,
              "missing_german_source_names": 1605,
              "language_neutral_resolved": len(neutral_paths),
              "explicit_german_resolved": len(german_paths),
              "total_resolved": resolved,
              "remaining_translation_count": remaining,
          }
          Path("build/qet-manufacturers-name-progress.json").write_text(
              json.dumps(progress, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(progress, ensure_ascii=False, indent=2))
          PY

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version --format about | tee build/kicad-version.txt

      - name: Load and render all manufacturer symbols with KiCad
        run: |
          mkdir -p build/kicad-svg-manufacturers
          kicad-cli sym export svg \
            --black-and-white \
            --output build/kicad-svg-manufacturers \
            build/Z_Q_QElectroTech_manufacturers.kicad_sym
          python - <<'PY'
          import json
          from pathlib import Path
          svg_files = sorted(Path("build/kicad-svg-manufacturers").glob("*.svg"))
          assert len(svg_files) == 4019
          assert all(path.stat().st_size > 0 for path in svg_files)
          Path("build/qet-manufacturers-kicad-smoke-report.json").write_text(
              json.dumps({"exported_svg_symbols": 4019, "expected_symbols": 4019, "empty_svg_files": 0}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload manufacturer validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qet-manufacturers-validation
          path: |
            build/Z_Q_QElectroTech_manufacturers.kicad_sym
            build/qet-manufacturers-report.json
            build/qet-manufacturers-source-audit.json
            build/qet-manufacturers-language-neutral-report.json
            build/qet-manufacturers-de-name-report.json
            build/qet-manufacturers-name-progress.json
            build/qet-manufacturers-kicad-smoke-report.json
            build/qet-source-commit.txt
            build/kicad-version.txt
