name: QET EN 60617 audit

on:
  push:
    branches:
      - agent/qet-phase1-91-en-60617
    paths:
      - "tools/convert_qet_to_kicad.py"
      - "tools/convert_qet_to_kicad_checked.py"
      - "tools/qet_xml.py"
      - "tools/audit_qet_source.py"
      - "tests/test_convert_qet_to_kicad.py"
      - "tests/test_convert_qet_to_kicad_checked.py"
      - "tests/test_audit_qet_source.py"
      - ".github/workflows/qet-91-en-60617-audit.yml"
  workflow_dispatch:
    inputs:
      qet_ref:
        description: "qelectrotech-elements ref/commit"
        required: true
        default: "42692ea76d2fcc3c6cf1ca335951584cd0978922"

permissions:
  contents: read

jobs:
  audit-qet-en-60617:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official QElectroTech elements
        uses: actions/checkout@v4
        with:
          repository: qelectrotech/qelectrotech-elements
          ref: ${{ github.event.inputs.qet_ref || '42692ea76d2fcc3c6cf1ca335951584cd0978922' }}
          path: .qet-elements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run converter and audit unit tests
        run: |
          python -m pytest \
            tests/test_convert_qet_to_kicad.py \
            tests/test_convert_qet_to_kicad_checked.py \
            tests/test_audit_qet_source.py \
            -q

      - name: Convert complete EN 60617 scope
        run: |
          python tools/convert_qet_to_kicad_checked.py \
            --qet-root .qet-elements/10_electric \
            --scope 91_en_60617 \
            --output build/Z_Q_QElectroTech_91_en_60617.kicad_sym \
            --report build/qet-91-en-60617-report.json \
            --fail-on-errors
          git -C .qet-elements rev-parse HEAD > build/qet-source-commit.txt

      - name: Audit source names
        run: |
          python tools/audit_qet_source.py \
            --qet-root .qet-elements/10_electric \
            --scope 91_en_60617 \
            --output build/qet-91-en-60617-source-audit.json

      - name: Validate raw library structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          library = Path("build/Z_Q_QElectroTech_91_en_60617.kicad_sym").read_text(encoding="utf-8")
          report = json.loads(Path("build/qet-91-en-60617-report.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("build/qet-91-en-60617-source-audit.json").read_text(encoding="utf-8"))

          assert report["source_files"] > 0
          assert report["converted"] == report["source_files"], report["errors"]
          assert not report["errors"], report["errors"]
          assert not report["unsupported_nodes"], report["unsupported_nodes"]
          assert audit["source_files"] == report["source_files"]
          assert audit["missing_german_names"] == report["missing_german_names"]
          assert not audit["parse_errors"], audit["parse_errors"]

          top_level = sum(1 for line in library.splitlines() if line.startswith('  (symbol "Z_Q_'))
          assert top_level == report["converted"]
          assert library.count('(property "QET_Source_Path" ') == report["converted"]
          assert library.count('(property "QET_Category" ') == report["converted"]
          assert library.count('(property "QET_Adjustments" ') == report["converted"]
          PY

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version --format about | tee build/kicad-version.txt

      - name: Load and render all EN 60617 symbols with KiCad
        run: |
          mkdir -p build/kicad-svg-91-en-60617
          kicad-cli sym export svg \
            --black-and-white \
            --output build/kicad-svg-91-en-60617 \
            build/Z_Q_QElectroTech_91_en_60617.kicad_sym
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/qet-91-en-60617-report.json").read_text(encoding="utf-8"))
          svg_files = sorted(Path("build/kicad-svg-91-en-60617").glob("*.svg"))
          assert len(svg_files) == report["converted"], (len(svg_files), report["converted"])
          assert all(path.stat().st_size > 0 for path in svg_files)
          Path("build/qet-91-en-60617-kicad-smoke-report.json").write_text(
              json.dumps({
                  "exported_svg_symbols": len(svg_files),
                  "expected_symbols": report["converted"],
                  "empty_svg_files": 0,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload EN 60617 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qet-91-en-60617-audit
          path: |
            build/Z_Q_QElectroTech_91_en_60617.kicad_sym
            build/qet-91-en-60617-report.json
            build/qet-91-en-60617-source-audit.json
            build/qet-91-en-60617-kicad-smoke-report.json
            build/qet-source-commit.txt
            build/kicad-version.txt
